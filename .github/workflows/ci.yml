name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package
        run: bun run check:ci


      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Smoke test ESM output
        run: node --input-type=module -e "import('./dist/index.js')"

      - name: Smoke test CommonJS output
        run: node -e "require('./dist/index.cjs')"
